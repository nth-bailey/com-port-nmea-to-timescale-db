[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpsink"
version = "0.1.0"
description = "Stream NMEA GPS data from a COM port radio dongle into TimescaleDB with PostGIS"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "psycopg2-binary>=2.9",
    "pynmea2>=1.19",
    "click>=8.1",
]

[project.scripts]
gpsink = "gpsink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpsink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]
